[build-system]
requires = ["maturin>=1.8.1"]
build-backend = "maturin"

[project]
name = "delver_pdf"
version = "0.2.0-rc.1"
description = "Delver is a tool for declarative PDF extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module", "extension-module"]

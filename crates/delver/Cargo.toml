[package]
name = "delver"
version = "0.2.0-rc.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "delver"
path = "src/main.rs"

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
delver-core = { path = "../delver-core" }
delver-embed = { path = "../delver-embed" }
delver-parse-dbx = { path = "../delver-parse-dbx" }
delver-store = { path = "../delver-store" }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# fmt+json power --trace-json; env-filter powers RUST_LOG-style filtering.
# The feature deps (tracing-serde, serde, matchers, ...) were already edges
# of the locked graph — no new crates (D-027).
tracing-subscriber = { workspace = true, features = ["env-filter", "valuable", "fmt", "json"] }
tracing-appender = { workspace = true }
# Hierarchical stderr tree for --trace-stderr / the no-collector fallback
# (workspace-pinned; delver-core already builds it).
tracing-tree = { workspace = true }
# Transport for the hand-rolled OTLP/HTTP JSON exporter (D-027); the same
# pinned version delver-embed already uses.
ureq = { version = "2.12.1", features = ["json"] }
shellexpand = { workspace = true }
pyo3 = { version = "0.25.1", features = ["extension-module"], optional = true }
tokenizers = { version = "0.21.2", features = ["http"] }
anyhow.workspace = true
serde_json = { workspace = true }
uuid = { workspace = true }
# SIGPIPE reset in main() (D-018). Already pinned in Cargo.lock (transitive),
# so the firewalled crates.io index is never consulted.
libc = "0.2"

# NOTE: flamegraph is intentionally not a dev-dependency: it is the
# `cargo flamegraph` subcommand (install with `cargo install flamegraph`),
# not a library, and listing it forced every `cargo test -p delver` to
# build the whole cargo toolchain dependency tree.
[dev-dependencies]
pretty_assertions = { workspace = true }
strsim = { workspace = true }
lopdf = { workspace = true }
ordered-float = { workspace = true }
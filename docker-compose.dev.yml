services:
  db:
    image: pgvector/pgvector:pg17
    container_name: delver-dev-db
    environment:
      POSTGRES_USER: delver
      POSTGRES_PASSWORD: delver
      POSTGRES_DB: delver
    ports:
      - "5433:5432"
    volumes:
      - delver-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delver -d delver"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  delver-pgdata:
